<script type="module">
import*as THREE from'three';
import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';
import{RenderPass}from'three/addons/postprocessing/RenderPass.js';
import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';

var FilesetResolver,HandLandmarker;
try{var mv=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs');FilesetResolver=mv.FilesetResolver;HandLandmarker=mv.HandLandmarker;}catch(e){console.warn('[MP] tasks-vision 不可用');}

try{
if(typeof THREE==='undefined')throw new Error('Three.js 加载失败');

var scene,camera,renderer,composer,bloomPass;
var particleSystem,bgStarSystem,meteorSystem,nebulaSystems=[];
var gui;var clock=new THREE.Clock();

var handState={detected:false,openness:0,targetOpenness:0,dx:0,dy:0,targetDx:0,targetDy:0};
var mouseState={isDown:false,prevX:0,prevY:0,wheelDelta:0,targetWheel:0};
var targetRotation={x:0,y:0};
var currentModel='heart';
var particleCount=CONFIG.PARTICLE_COUNT_DEFAULT;
var particlePositions,particleTargets,particleStarts,particleSpeeds,particleSizes;
var isTransitioning=false,transitionStartTime=0;
var rotationPaused=false;
var handLandmarker=null,mpLoadTimer=null,mpVideoStream=null;
// 手势反馈
var rippleParticles=null,rippleLife=0;
var trailPositions=[],trailLives=[];

var uniforms={
  baseColor:{value:new THREE.Color(CONFIG.BASE_COLOR)},
  time:{value:0},openness:{value:0},particleTexture:{value:null},
};

// ===== 工具 =====
function lerp(a,b,t){return a+(b-a)*t}
function damp(c,t,l,dt){return lerp(c,t,1-Math.exp(-l*dt))}
function noise3D(x,y,z){return Math.sin(x*1.27+y*3.71+z*2.53)*.5+Math.sin(x*2.13-y*1.37+z*4.21)*.3+Math.sin(x*.73+y*2.91-z*1.83)*.2}
// 三次 ease-out
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
// 水晶重组过渡：散开→吸合→微过冲稳定
function crystalTransition(t){
  if(t<.15)return easeOutCubic(t/.15)*.15; // 轻微散开
  if(t<.85)return .15+easeOutCubic((t-.15)/.7)*.75; // 主体吸合
  var st=(t-.85)/.15;return .9+Math.sin(st*Math.PI)*.03*(1-st); // 微过冲
}

// ===== 八角星光贴图 =====
function createParticleTexture(){
  var s=128,c=document.createElement('canvas');c.width=s;c.height=s;
  var ctx=c.getContext('2d'),h=s/2;
  // 底层：大柔光晕（暖粉）
  var g1=ctx.createRadialGradient(h,h,0,h,h,h);
  g1.addColorStop(0,'rgba(255,230,240,.9)');
  g1.addColorStop(.2,'rgba(255,200,220,.4)');
  g1.addColorStop(.5,'rgba(255,180,210,.08)');
  g1.addColorStop(1,'rgba(255,180,210,0)');
  ctx.fillStyle=g1;ctx.fillRect(0,0,s,s);
  // 中层：八角星光
  ctx.globalCompositeOperation='lighter';
  var rays=8,lengths=[1,.6,1,.6,.8,.8,.8,.8]; // 长短交替
  for(var i=0;i<rays;i++){
    var angle=i*Math.PI*4/rays,len=lengths[i]*h*.85;
    var grad=ctx.createLinearGradient(h,h,h+Math.cos(angle)*len,h+Math.sin(angle)*len);
    grad.addColorStop(0,'rgba(255,245,240,.7)');
    grad.addColorStop(.4,'rgba(255,230,240,.3)');
    grad.addColorStop(1,'rgba(255,230,240,0)');
    ctx.strokeStyle=grad;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(h,h);
    ctx.lineTo(h+Math.cos(angle)*len,h+Math.sin(angle)*len);ctx.stroke();
  }
  // 顶层：纯白核心
  var g2=ctx.createRadialGradient(h,h,0,h,h,4);
  g2.addColorStop(0,'rgba(255,255,255,1)');
  g2.addColorStop(.5,'rgba(255,250,255,.6)');
  g2.addColorStop(1,'rgba(255,250,255,0)');
  ctx.fillStyle=g2;ctx.fillRect(h-6,h-6,12,12);
  ctx.globalCompositeOperation='source-over';
  uniforms.particleTexture.value=new THREE.CanvasTexture(c);
}

// ===== 粒子模型 =====
function createParticleModel(m,n){
  var p=new Float32Array(n*3);
  switch(m){
    case'heart':genHeart(p,n);break;case'nebula':genNebula(p,n);break;
    case'firework':genFirework(p,n);break;case'saturn':genSaturn(p,n);break;
    case'flower':genFlower(p,n);break;
  }
  return p;
}

// ❤️ 水晶心形（3D 体积 + 密度梯度 + 大小梯度）
function genHeart(p,n){
  // 预计算粒子大小
  if(!particleSizes)particleSizes=new Float32Array(n);
  for(var i=0;i<n;i++){
    // 用 rejection sampling 在心形体积内采样
    var x,y,z,valid=false;
    while(!valid){
      // 球坐标采样，映射到心形表面
      var u=Math.random()*Math.PI*2;
      var v=Math.random()*Math.PI;
      // 心形表面参数方程
      var r=1;
      var sx=16*Math.pow(Math.sin(u),3)*r;
      var sy=(13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u))*r;
      // 法线方向偏移（径向厚度）
      var thickness=.3+Math.random()*.8;
      // 表面法线近似：归一化 (sx,sy) 方向
      var normLen=Math.sqrt(sx*sx+sy*sy)||1;
      var nx=sx/normLen,ny=sy/normLen;
      // 在法线方向上偏移，中心厚边缘薄
      var edgeFactor=Math.abs(sx)/16; // 0=中心, 1=边缘
      var thick=thickness*(1-edgeFactor*.6);
      x=sx+nx*thick*(Math.random()-.5)*2;
      y=sy+ny*thick*(Math.random()-.5)*2;
      // Z 轴：基于心形宽度的弧形分布
      var widthAtY=Math.max(0,1-Math.pow(y/15,2));
      z=(Math.random()-.5)*widthAtY*3;
      // 密度梯度：尖端(底部y负)和圆弧(y正)更密集
      var tipFactor=1+Math.max(0,-y/10)*.3; // 底部尖端 +30%
      var arcFactor=1+Math.max(0,(y-5)/10)*.2; // 顶部圆弧 +20%
      var density=tipFactor*arcFactor;
      if(Math.random()<density*.7||i<n*.1)valid=true;
    }
    p[i*3]=x*.22;p[i*3+1]=y*.22;p[i*3+2]=z*.22;
    // 大小梯度：表面粒子大，内部小
    var distFromCenter=Math.sqrt(x*x+y*y+z*z)/16;
    particleSizes[i]=distFromCenter>.6?1.2+Math.random()*.8:.3+Math.random()*.5;
  }
}
function genNebula(p,n){for(var i=0;i<n;i++){var t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=3+Math.random()*5+noise3D(Math.sin(ph)*Math.cos(t)*2,Math.sin(ph)*Math.sin(t)*2,Math.cos(ph)*2)*2.5;p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.sin(ph)*Math.sin(t);p[i*3+2]=r*Math.cos(ph);}}
function genFirework(p,n){for(var i=0;i<n;i++){var a=i%6,t=(i/n)*3,an=(a/6)*Math.PI*2+t*Math.PI*2,r=t*3.5+Math.random()*.8;p[i*3]=r*Math.cos(an);p[i*3+1]=(Math.random()-.5)*1.5+t*.5;p[i*3+2]=r*Math.sin(an);}}
function genSaturn(p,n){var cc=Math.floor(n*.35);for(var i=0;i<cc;i++){var t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=Math.pow(Math.random(),.5)*2.5;p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.sin(ph)*Math.sin(t)*.7;p[i*3+2]=r*Math.cos(ph);}for(var i=cc;i<n;i++){var MR=4+Math.random()*3,mR=(Math.random()-.5)*.6,t=Math.random()*Math.PI*2,ph=Math.random()*Math.PI*2,j=i*3;p[j]=(MR+mR*Math.cos(ph))*Math.cos(t);p[j+1]=mR*Math.sin(ph)*.3;p[j+2]=(MR+mR*Math.cos(ph))*Math.sin(t);}}
function genFlower(p,n){for(var i=0;i<n;i++){var t=(i/n)*Math.PI*2,r=Math.abs(Math.cos(5*t/2))*5+.5;p[i*3]=r*Math.cos(t)+(Math.random()-.5)*.3;p[i*3+1]=(Math.random()-.5)*1.2;p[i*3+2]=r*Math.sin(t)+(Math.random()-.5)*.3;}}

// ===== 流星（带拖尾）=====
function createMeteors(){
  var count=8,maxTrail=15;
  var totalVerts=count*maxTrail;
  var geo=new THREE.BufferGeometry();
  var pos=new Float32Array(totalVerts*3),col=new Float32Array(totalVerts*3);
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setDrawRange(0,0);
  var mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});
  meteorSystem=new THREE.LineSegments(geo,mat);
  meteorSystem.userData={count:count,maxTrail:maxTrail,life:new Float32Array(count),head:new Float32Array(count*3),vel:new Float32Array(count*3),trailIdx:new Float32Array(count)};
  scene.add(meteorSystem);
}
function updateMeteors(dt){
  if(!meteorSystem)return;
  var d=meteorSystem.userData,pos=meteorSystem.geometry.attributes.position.array,col=meteorSystem.geometry.attributes.color.array;
  var totalVerts=d.count*d.maxTrail,drawCount=0;
  for(var m=0;m<d.count;m++){
    d.life[m]-=dt;
    if(d.life[m]<=0){
      if(Math.random()<dt*0.1){
        d.head[m*3]=(Math.random()-.5)*50;d.head[m*3+1]=20+Math.random()*10;d.head[m*3+2]=(Math.random()-.5)*30-20;
        d.vel[m*3]=(Math.random()-.5)*15-5;d.vel[m*3+1]=-25-Math.random()*15;d.vel[m*3+2]=(Math.random()-.5)*8;
        d.life[m]=.8+Math.random()*.6;d.trailIdx[m]=0;
      }
      continue;
    }
    // 推进头部
    d.vel[m*3+1]-=dt*8; // 轻微重力
    d.head[m*3]+=d.vel[m*3]*dt;d.head[m*3+1]+=d.vel[m*3+1]*dt;d.head[m*3+2]+=d.vel[m*3+2]*dt;
    // 记录拖尾
    var ti=Math.floor(d.trailIdx[m])%d.maxTrail;
    var base=(m*d.maxTrail+ti)*3;
    pos[base]=d.head[m*3];pos[base+1]=d.head[m*3+1];pos[base+2]=d.head[m*3+2];
    // 暖金色头部→淡粉尾部
    var lifeFrac=d.life[m]/1.4;
    col[base]=1;col[base+1]=.84*lifeFrac+.5*(1-lifeFrac);col[base+2]=.1*lifeFrac+.6*(1-lifeFrac);
    d.trailIdx[m]=(ti+1);
    // 绘制拖尾线段
    var prevIdx=ti;
    for(var t=0;t<d.maxTrail-1;t++){
      var curr=prevIdx,prev=(curr-1+d.maxTrail)%d.maxTrail;
      var cb=(m*d.maxTrail+curr)*3,pb=(m*d.maxTrail+prev)*3;
      if(pos[pb+1]<-30)break; // 已落地
      var fade=1-t/d.maxTrail;
      var o=drawCount*3;
      pos[o]=pos[cb];pos[o+1]=pos[cb+1];pos[o+2]=pos[cb+2];
      pos[o+3]=pos[pb];pos[o+4]=pos[pb+1];pos[o+5]=pos[pb+2];
      col[o]=col[cb];col[o+1]=col[cb+1];col[o+2]=col[cb+2];
      col[o+3]=col[pb]*fade;col[o+4]=col[pb+1]*fade;col[o+5]=col[pb+2]*fade;
      drawCount++;prevIdx=prev;
    }
  }
  meteorSystem.geometry.setDrawRange(0,drawCount*2);
  meteorSystem.geometry.attributes.position.needsUpdate=true;
  meteorSystem.geometry.attributes.color.needsUpdate=true;
}

// ===== 星云背景层 =====
function createNebulaPlanes(){
  var colors=[[.1,.03,.12],[.06,.02,.09],[.17,.07,.22]];
  for(var l=0;l<CONFIG.NEBULA_LAYERS;l++){
    var geo=new THREE.PlaneGeometry(200,200);
    var mat=new THREE.ShaderMaterial({
      uniforms:{time:uniforms.time,layerIdx:{value:l},baseColor:{value:new THREE.Color(colors[l%3][0],colors[l%3][1],colors[l%3][2])}},
      vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader:[
        'uniform float time;uniform float layerIdx;uniform vec3 baseColor;',
        'varying vec2 vUv;',
        // 简化的 fbm 噪声
        'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
        'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}',
        'float fbm(vec2 p){float v=0.0,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p*=2.0;a*=.5;}return v;}',
        'void main(){',
        '  vec2 uv=vUv*3.0+layerIdx*1.7;',
        '  float t=time*.02*(.8+layerIdx*.3);',
        '  float n=fbm(uv+vec2(t,t*.7));',
        '  float alpha=smoothstep(.3,.7,n)*.06;',
        '  gl_FragColor=vec4(baseColor,alpha);',
        '}'
      ].join('\n'),
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    });
    var plane=new THREE.Mesh(geo,mat);
    plane.position.z=-80-l*30;plane.rotation.x=l*.2;
    scene.add(plane);nebulaSystems.push(plane);
  }
}

// ===== 粒子系统 =====
function createParticleSystem(count){
  if(particleSystem){scene.remove(particleSystem);particleSystem.geometry.dispose();particleSystem.material.dispose();}
  var geo=new THREE.BufferGeometry();
  particlePositions=new Float32Array(count*3);particleTargets=new Float32Array(count*3);particleStarts=new Float32Array(count*3);
  if(!particleSizes||particleSizes.length!==count){particleSizes=new Float32Array(count);for(var i=0;i<count;i++)particleSizes[i]=.5+Math.random();}
  particleSpeeds=new Float32Array(count);for(var i=0;i<count;i++)particleSpeeds[i]=.5+Math.random()*1.5;
  var mp=createParticleModel(currentModel,count);
  particlePositions.set(mp);particleTargets.set(mp);particleStarts.set(mp);
  geo.setAttribute('position',new THREE.BufferAttribute(particlePositions,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(particleSizes,1));
  geo.setAttribute('aSpeed',new THREE.BufferAttribute(particleSpeeds,1));

  var BS=CONFIG.BREATHING_SPEED.toFixed(1),BA=CONFIG.BREATHING_AMPLITUDE.toFixed(3);
  var SM=CONFIG.SCALE_MIN.toFixed(1),SX=CONFIG.SCALE_MAX.toFixed(1);
  var PS=CONFIG.PARTICLE_BASE_SIZE.toFixed(1),PO=CONFIG.PARTICLE_OPACITY.toFixed(2);

  var mat=new THREE.ShaderMaterial({
    uniforms:uniforms,
    vertexShader:[
      'attribute float aSize;','attribute float aSpeed;',
      'uniform float openness;','uniform float time;',
      'varying float vDist;','varying float vAlpha;','varying float vPhase;',
      'void main(){',
      '  vec3 pos=position;',
      '  float bt=time*'+BS+'*aSpeed+aSize*10.0;',
      '  pos+=vec3(sin(bt)*'+BA+',cos(bt*.7)*'+BA+',sin(bt*1.3)*'+BA+');',
      '  float sc=mix('+SM+','+SX+',openness);pos*=sc;',
      '  vec4 mv=modelViewMatrix*vec4(pos,1.0);',
      '  vDist=length(position)/6.0;',
      '  vAlpha=smoothstep(80.0,8.0,-mv.z);',
      '  vPhase=aSpeed;',
      // 星星眨眼：gl_PointSize 随 aSpeed 缓慢脉动
      '  float pulse=.7+.6*(.5+.5*sin(time*aSpeed*1.5));',
      '  gl_PointSize=max(aSize*'+PS+'*(300.0/-mv.z)*pulse,1.0);',
      '  gl_Position=projectionMatrix*mv;',
      '}'
    ].join('\n'),
    fragmentShader:[
      'uniform vec3 baseColor;','uniform float time;','uniform sampler2D particleTexture;',
      'varying float vDist;','varying float vAlpha;','varying float vPhase;',
      'void main(){',
      '  vec4 tc=texture2D(particleTexture,gl_PointCoord);if(tc.a<.01)discard;',
      // 高级珠宝色：暖粉→玫瑰金→淡紫，极缓慢漂移
      '  float t=time*.04+vPhase*.3;', // 10-15秒循环 + 粒子相位差
      '  vec3 warm=vec3(1.,.42,.62);', // #ff6b9d
      '  vec3 rose=vec3(1.,.72,.70);', // #ffb7b2
      '  vec3 lav=vec3(.88,.67,1.);', // #e0aaff
      '  float drift=.5+.5*sin(t);',
      '  vec3 c=mix(warm,rose,drift*.6);',
      '  c=mix(c,lav,smoothstep(.6,1.,vDist));', // 边缘偏冷紫
      '  c=mix(c,vec3(1.,.96,.93),vDist<.3?.25*(1.-vDist/.3):0.);', // 中心暖金高光
      // 内发光：中心更亮，边缘更暗
      '  float brightness=1.2-vDist*.4;',
      '  c*=brightness;',
      '  c=clamp(c,0.0,1.3);',
      // 呼吸此起彼伏
      '  float breathe=.85+.15*sin(time*vPhase*2.);',
      '  gl_FragColor=vec4(c,tc.a*'+PO+'*vAlpha*breathe);',
      '}'
    ].join('\n'),
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });
  particleSystem=new THREE.Points(geo,mat);
  scene.add(particleSystem);
}

// ===== 背景星空（暖色分层）=====
function createBackgroundStars(){
  if(bgStarSystem){scene.remove(bgStarSystem);bgStarSystem.geometry.dispose();bgStarSystem.material.dispose();}
  var n=CONFIG.BG_STAR_COUNT,geo=new THREE.BufferGeometry();
  var pos=new Float32Array(n*3),col=new Float32Array(n*3),phases=new Float32Array(n),sizes=new Float32Array(n);
  // 暖色系：暖白、淡金、极淡粉
  var warmHues=[.08,.05,.95,.1,.0]; // 金色、粉色系
  for(var i=0;i<n;i++){
    pos[i*3]=(Math.random()-.5)*200;pos[i*3+1]=(Math.random()-.5)*200;
    pos[i*3+2]=CONFIG.BG_STAR_Z_MIN+Math.random()*(CONFIG.BG_STAR_Z_MAX-CONFIG.BG_STAR_Z_MIN);
    var h=warmHues[Math.floor(Math.random()*warmHues.length)]+Math.random()*.05;
    var s=.2+Math.random()*.3,l=.65+Math.random()*.3;
    var c=new THREE.Color().setHSL(h,s,l);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    // 大小分层：80%微尘，15%中等，5%亮星
    var rnd=Math.random();
    if(rnd<.8){sizes[i]=.5;phases[i]=99;} // 微尘几乎不闪
    else if(rnd<.95){sizes[i]=1.2;phases[i]=Math.random()*Math.PI*2;}
    else{sizes[i]=2.0;phases[i]=Math.random()*Math.PI*2;} // 亮星
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aPhase',new THREE.BufferAttribute(phases,1));
  geo.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
  var mat=new THREE.ShaderMaterial({
    uniforms:{time:uniforms.time},
    vertexShader:[
      'attribute float aPhase;attribute float aSize;attribute vec3 color;',
      'uniform float time;varying vec3 vCol;varying float vBr;',
      'void main(){',
      '  vCol=color;',
      // 亮星闪烁慢(3-5秒)，微尘几乎不闪
      '  float speed=aPhase>50.?.0:aPhase>5.?1.5:0.5;',
      '  vBr=aPhase>50.?.6:.5+.5*sin(time*speed+aPhase);',
      '  vec4 mv=modelViewMatrix*vec4(position,1.0);',
      '  gl_PointSize=max(aSize*(200.0/-mv.z),0.3);',
      '  gl_Position=projectionMatrix*mv;',
      '}'
    ].join('\n'),
    fragmentShader:[
      'varying vec3 vCol;varying float vBr;',
      'void main(){',
      '  float d=length(gl_PointCoord-.5);if(d>.5)discard;',
      '  float a=(1.0-smoothstep(.1,.5,d))*.3*vBr;',
      '  gl_FragColor=vec4(vCol,a);',
      '}'
    ].join('\n'),
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });
  bgStarSystem=new THREE.Points(geo,mat);scene.add(bgStarSystem);
}

// ===== 模型切换 =====
function switchModel(name){
  if(name===currentModel&&!isTransitioning)return;
  currentModel=name;particleStarts.set(particlePositions);
  var nt=createParticleModel(name,particleCount);
  for(var i=0;i<particleCount;i++){var j=i*3;
    if(i<nt.length/3){particleTargets[j]=nt[j];particleTargets[j+1]=nt[j+1];particleTargets[j+2]=nt[j+2];}
    else{particleTargets[j]=0;particleTargets[j+1]=0;particleTargets[j+2]=0;}
  }
  isTransitioning=true;transitionStartTime=clock.getElapsedTime();
}
function updateParticleCount(c){if(c===particleCount)return;particleCount=c;createParticleSystem(particleCount);}

function initMouseInteraction(){
  var cv=renderer.domElement;
  cv.addEventListener('mousedown',function(e){if(handState.detected)return;mouseState.isDown=true;mouseState.prevX=e.clientX;mouseState.prevY=e.clientY;});
  window.addEventListener('mousemove',function(e){if(!mouseState.isDown||handState.detected)return;targetRotation.y+=(e.clientX-mouseState.prevX)*CONFIG.MOUSE_ROTATION_SPEED;targetRotation.x+=(e.clientY-mouseState.prevY)*CONFIG.MOUSE_ROTATION_SPEED;mouseState.prevX=e.clientX;mouseState.prevY=e.clientY;});
  window.addEventListener('mouseup',function(){mouseState.isDown=false;});
  // 带阻尼的滚轮缩放
  cv.addEventListener('wheel',function(e){if(handState.detected)return;e.preventDefault();mouseState.targetWheel=Math.max(0,Math.min(1,mouseState.targetWheel-e.deltaY*CONFIG.MOUSE_WHEEL_SPEED*.01));},{passive:false});
  var tpx=0,tpy=0,pinchD=0,touching=false;
  cv.addEventListener('touchstart',function(e){if(handState.detected)return;if(e.touches.length===1){touching=true;tpx=e.touches[0].clientX;tpy=e.touches[0].clientY;}else if(e.touches.length===2){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinchD=Math.sqrt(dx*dx+dy*dy);}},{passive:true});
  cv.addEventListener('touchmove',function(e){if(handState.detected)return;e.preventDefault();if(e.touches.length===1&&touching){targetRotation.y+=(e.touches[0].clientX-tpx)*CONFIG.MOUSE_ROTATION_SPEED;targetRotation.x+=(e.touches[0].clientY-tpy)*CONFIG.MOUSE_ROTATION_SPEED;tpx=e.touches[0].clientX;tpy=e.touches[0].clientY;}else if(e.touches.length===2){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,nd=Math.sqrt(dx*dx+dy*dy);mouseState.targetWheel=Math.max(0,Math.min(1,mouseState.targetWheel+(nd-pinchD)*.005));pinchD=nd;}},{passive:false});
  cv.addEventListener('touchend',function(){touching=false;},{passive:true});
}

// ===== 手部追踪 =====
function initHandTracking(){
  var videoEl=document.getElementById('webcam-video'),overlayEl=document.getElementById('webcam-overlay'),statusEl=document.getElementById('hand-status');
  if(!FilesetResolver||!HandLandmarker){showWebcamError('手部模型不可用');setTimeout(function(){document.getElementById('webcam-container').style.display='none';},3000);return;}
  setLoadProgress('加载 MediaPipe...');
  FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm')
  .then(function(v){return HandLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:'hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:0.5,minHandPresenceConfidence:0.5,minTrackingConfidence:0.5})
    .catch(function(){return HandLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:'hand_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:0.5,minHandPresenceConfidence:0.5,minTrackingConfidence:0.5});});
  }).then(function(d){if(!d)throw new Error('null');handLandmarker=d;startCamera();})
  .catch(function(e){console.error('[Hand]',e);showWebcamError('手部模型加载失败');setTimeout(function(){document.getElementById('webcam-container').style.display='none';},5000);});

  function startCamera(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showWebcamError('不支持摄像头');return;}
    try{if(mpVideoStream){mpVideoStream.getTracks().forEach(function(t){t.stop();});mpVideoStream=null;}}catch(e){}
    navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}})
    .then(function(stream){mpVideoStream=stream;videoEl.srcObject=stream;videoEl.onloadedmetadata=function(){videoEl.play();overlayEl.classList.add('hidden');var hc=document.getElementById('hand-canvas');hc.width=videoEl.videoWidth;hc.height=videoEl.videoHeight;startLoop();};})
    .catch(function(e){var m='无法访问摄像头';if(e.name==='NotAllowedError')m='权限被拒绝';showWebcamError(m);});
  }
  var firstOK=false;
  function startLoop(){
    mpLoadTimer=setTimeout(function(){if(!firstOK)statusEl.textContent='加载超时';},15000);
    function f(){if(!handLandmarker||!videoEl||videoEl.readyState<2){requestAnimationFrame(f);return;}
      try{var r=handLandmarker.detectForVideo(videoEl,performance.now());if(!firstOK&&r.landmarks&&r.landmarks.length>0){firstOK=true;if(mpLoadTimer)clearTimeout(mpLoadTimer);}onHandUpdate(r);}catch(e){}requestAnimationFrame(f);}
    requestAnimationFrame(f);
  }
}

function showWebcamError(m){var el=document.getElementById('webcam-overlay');el.classList.add('error');el.innerHTML='<div><div class="icon">⚠️</div><div>'+m+'</div></div>';}

function onHandUpdate(result){
  var hc=document.getElementById('hand-canvas'),ctx=hc.getContext('2d'),w=hc.width,h=hc.height;
  ctx.clearRect(0,0,w,h);
  if(result.landmarks&&result.landmarks.length>0){
    var lm=result.landmarks[0];handState.detected=true;
    document.getElementById('hand-status').textContent='✨ 已检测';
    document.getElementById('control-mode').textContent='🖐️';
    drawHandSkeleton(ctx,lm,w,h);
    var pcx=(lm[0].x+lm[9].x)/2,pcy=(lm[0].y+lm[9].y)/2,pcz=(lm[0].z+lm[9].z)/2;
    var td=0,tips=[4,8,12,16,20];for(var j=0;j<5;j++){var dx=lm[tips[j]].x-pcx,dy=lm[tips[j]].y-pcy,dz=lm[tips[j]].z-pcz;td+=Math.sqrt(dx*dx+dy*dy+dz*dz);}
    handState.targetOpenness=Math.max(0,Math.min(1,(td/5-.04)/.30))*CONFIG.OPENNESS_SENSITIVITY;
    handState.targetDx=-(lm[0].x-.5)*2;handState.targetDy=(lm[0].y-.5)*2;
  }else{handState.detected=false;document.getElementById('hand-status').textContent='未检测';document.getElementById('control-mode').textContent='🖱️';handState.targetOpenness=0;handState.targetDx=0;handState.targetDy=0;}
}

// 魔法手势绘制
function drawHandSkeleton(ctx,lm,w,h){
  // 极细骨架线（几乎不可见）
  var cn=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
  ctx.strokeStyle='rgba(255,230,200,.12)';ctx.lineWidth=1;
  for(var i=0;i<cn.length;i++){ctx.beginPath();ctx.moveTo(lm[cn[i][0]].x*w,lm[cn[i][0]].y*h);ctx.lineTo(lm[cn[i][1]].x*w,lm[cn[i][1]].y*h);ctx.stroke();}
  // 指尖：小星星（四角星+光晕）
  var tipIdx=[4,8,12,16,20];
  for(var t=0;t<tipIdx.length;t++){
    var x=lm[tipIdx[t]].x*w,y=lm[tipIdx[t]].y*h;
    // 光晕
    var grd=ctx.createRadialGradient(x,y,0,x,y,12);
    grd.addColorStop(0,'rgba(255,215,0,.3)');grd.addColorStop(1,'rgba(255,215,0,0)');
    ctx.fillStyle=grd;ctx.fillRect(x-12,y-12,24,24);
    // 四角星
    ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffd700';
    ctx.beginPath();var sr=4;
    for(var a=0;a<4;a++){var ang=a*Math.PI/2;ctx.lineTo(Math.cos(ang)*sr,Math.sin(ang)*sr);var ang2=ang+Math.PI/4;ctx.lineTo(Math.cos(ang2)*sr*.3,Math.sin(ang2)*sr*.3);}
    ctx.closePath();ctx.fill();ctx.restore();
  }
  // 掌心：柔光点
  var px=(lm[0].x+lm[9].x)/2*w,py=(lm[0].y+lm[9].y)/2*h;
  var pg=ctx.createRadialGradient(px,py,0,px,py,16);
  pg.addColorStop(0,'rgba(255,107,157,.4)');pg.addColorStop(1,'rgba(255,107,157,0)');
  ctx.fillStyle=pg;ctx.fillRect(px-16,py-16,32,32);
}

// ===== 摄像头拖拽 =====
function initWebcamDrag(){
  var ct=document.getElementById('webcam-container'),dragging=false,sx,sy,sl,sb;
  function start(x,y){dragging=true;sx=x;sy=y;var r=ct.getBoundingClientRect();sl=r.left;sb=window.innerHeight-r.bottom;}
  function move(x,y){if(!dragging)return;ct.style.left=(sl+(x-sx))+'px';ct.style.bottom=(sb-(y-sy))+'px';ct.style.right='auto';}
  function end(){dragging=false;}
  ct.addEventListener('mousedown',function(e){if(e.target.id==='webcam-label'||e.target===ct){start(e.clientX,e.clientY);e.preventDefault();}});
  document.addEventListener('mousemove',function(e){move(e.clientX,e.clientY);});
  document.addEventListener('mouseup',end);
  ct.addEventListener('touchstart',function(e){if(e.target.id==='webcam-label'||e.target===ct)start(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  document.addEventListener('touchmove',function(e){if(dragging)move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  document.addEventListener('touchend',end);
}

// ===== 主循环 =====
var frameCount=0,lastFpsTime=0;
function animate(){
  requestAnimationFrame(animate);
  var dt=clock.getDelta(),elapsed=clock.getElapsedTime();
  uniforms.time.value=elapsed;

  // 手部平滑
  var ls=CONFIG.SMOOTHING_FACTOR*60;
  handState.openness=damp(handState.openness,handState.targetOpenness,ls,dt);
  handState.dx=damp(handState.dx,handState.targetDx,ls,dt);
  handState.dy=damp(handState.dy,handState.targetDy,ls,dt);
  // 滚轮阻尼
  mouseState.wheelDelta=damp(mouseState.wheelDelta,mouseState.targetWheel,8,dt);
  uniforms.openness.value=handState.detected?handState.openness:mouseState.wheelDelta;

  if(!rotationPaused&&handState.detected){targetRotation.y+=handState.dx*CONFIG.ROTATION_SENSITIVITY;targetRotation.x+=handState.dy*CONFIG.ROTATION_SENSITIVITY;}

  // 水晶重组过渡
  if(isTransitioning){
    var t=Math.min(1,(elapsed-transitionStartTime)/(CONFIG.TRANSITION_DURATION/1000));
    var e=crystalTransition(t);
    for(var i=0;i<particleCount;i++){var j=i*3;particlePositions[j]=lerp(particleStarts[j],particleTargets[j],e);particlePositions[j+1]=lerp(particleStarts[j+1],particleTargets[j+1],e);particlePositions[j+2]=lerp(particleStarts[j+2],particleTargets[j+2],e);}
    if(t>=1){isTransitioning=false;particlePositions.set(particleTargets);}
    particleSystem.geometry.attributes.position.needsUpdate=true;
  }

  // 温柔自转
  if(particleSystem){
    if(!handState.detected&&!mouseState.isDown)targetRotation.y+=dt*CONFIG.AUTO_ROTATE_SPEED;
    particleSystem.rotation.x=damp(particleSystem.rotation.x,targetRotation.x,3,dt);
    particleSystem.rotation.y=damp(particleSystem.rotation.y,targetRotation.y,3,dt);
  }
  if(bgStarSystem)bgStarSystem.rotation.y+=dt*.01;
  updateMeteors(dt);
  composer.render();
  frameCount++;
  if(elapsed-lastFpsTime>=1){document.getElementById('fps-display').textContent=frameCount;document.getElementById('particle-count').textContent=particleCount;frameCount=0;lastFpsTime=elapsed;}
}

// ===== 初始化 =====
function init(){
  setLoadProgress('创建渲染器...');
  scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0d0218,.005);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,500);camera.position.set(0,0,18);
  renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  setLoadProgress('后处理...');
  composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
  bloomPass=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),CONFIG.BLOOM_STRENGTH,CONFIG.BLOOM_RADIUS,CONFIG.BLOOM_THRESHOLD);composer.addPass(bloomPass);

  setLoadProgress('粒子纹理...');createParticleTexture();
  setLoadProgress('凝聚星尘...');createParticleSystem(particleCount);
  setLoadProgress('深空背景...');createBackgroundStars();createNebulaPlanes();createMeteors();

  if(typeof lil!=='undefined')createGUI();
  initMouseInteraction();initKeyboard();
  try{initHandTracking();}catch(e){console.warn('手部追踪跳过:',e);document.getElementById('webcam-container').style.display='none';}
  initWebcamDrag();

  window.addEventListener('resize',onResize);
  document.getElementById('fullscreen-btn').addEventListener('click',toggleFullscreen);
  document.getElementById('screenshot-btn').addEventListener('click',takeScreenshot);
  document.getElementById('guide-start-btn').addEventListener('click',function(){document.getElementById('guide-overlay').classList.add('hidden');});
  document.getElementById('guide-dismiss-btn').addEventListener('click',function(){document.getElementById('guide-overlay').classList.add('hidden');try{localStorage.setItem('particle-guide-dismissed','1');}catch(e){}});
  try{if(!localStorage.getItem('particle-guide-dismissed'))document.getElementById('guide-overlay').classList.remove('hidden');}catch(e){}
  window.addEventListener('beforeunload',function(){if(mpVideoStream)mpVideoStream.getTracks().forEach(function(t){t.stop();});});

  setLoadProgress('✨ 就绪');
  setTimeout(function(){document.getElementById('loading-screen').classList.add('fade-out');},400);
}

init();animate();

}catch(err){
  console.error('初始化异常:',err);
  var ls=document.getElementById('loading-screen');
  if(ls){ls.innerHTML='<div style="text-align:center;color:#ffe4e1;padding:20px;max-width:600px;word-break:break-all;">'+
    '<div style="font-size:48px;margin-bottom:16px;">💫</div><h2 style="font-weight:300;margin-bottom:12px;">加载出了点问题</h2>'+
    '<p style="color:rgba(255,228,225,.4);line-height:1.6;font-size:13px;">'+(err.message||err)+'</p>'+
    '<button onclick="location.reload()" style="margin-top:16px;padding:10px 28px;border-radius:24px;background:linear-gradient(135deg,#ff6b9d,#e0aaff);border:none;color:#fff;cursor:pointer;">重试</button></div>';}
}
</script>
</body>
