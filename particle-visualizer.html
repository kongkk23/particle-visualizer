if(typeof THREE==='undefined')throw new Error('Three.js 加载失败');

function lerp(a,b,t){return a+(b-a)*t}
function damp(c,t,l,dt){return lerp(c,t,1-Math.exp(-l*dt))}
function noise3D(x,y,z){return Math.sin(x*1.27+y*3.71+z*2.53)*.5+Math.sin(x*2.13-y*1.37+z*4.21)*.3+Math.sin(x*.73+y*2.91-z*1.83)*.2}
function easeOutQuad(t){return 1-(1-t)*(1-t)}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function easeOutElastic(t){if(t===0||t===1)return t;return Math.pow(2,-10*t)*Math.sin((t-.075)*(2*Math.PI)/.3)*.02+t}
function crystalTransition(t){if(t<.2)return easeOutQuad(t/.2)*.08;if(t<.8)return .08+easeOutCubic((t-.2)/.6)*.87;var s=(t-.8)/.2;return .95+easeOutElastic(s)*.05;}

// ===== 贴图 (512x512 实心核心) =====
function createParticleTexture(){
  var s=512,c=document.createElement('canvas');c.width=s;c.height=s;
  var ctx=c.getContext('2d'),h=s/2;
  // 底层柔光晕
  var g1=ctx.createRadialGradient(h,h,0,h,h,h);
  g1.addColorStop(0,'rgba(255,240,245,1)');
  g1.addColorStop(.12,'rgba(255,220,235,.7)');
  g1.addColorStop(.35,'rgba(255,200,220,.2)');
  g1.addColorStop(1,'rgba(255,200,220,0)');
  ctx.fillStyle=g1;ctx.fillRect(0,0,s,s);
  // 八角星光
  ctx.globalCompositeOperation='lighter';
  var rays=8,lengths=[1,.5,1,.5,.7,.7,.7,.7];
  for(var i=0;i<rays;i++){
    var angle=i*Math.PI/4,len=lengths[i]*h*.85;
    var grad=ctx.createLinearGradient(h,h,h+Math.cos(angle)*len,h+Math.sin(angle)*len);
    grad.addColorStop(0,'rgba(255,245,240,.5)');
    grad.addColorStop(.3,'rgba(255,230,240,.2)');
    grad.addColorStop(1,'rgba(255,230,240,0)');
    ctx.strokeStyle=grad;ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(h,h);ctx.lineTo(h+Math.cos(angle)*len,h+Math.sin(angle)*len);ctx.stroke();
  }
  // 实心核心（关键：不开 Bloom 也是亮点）
  var g2=ctx.createRadialGradient(h,h,0,h,h,10);
  g2.addColorStop(0,'rgba(255,255,255,1)');
  g2.addColorStop(.3,'rgba(255,245,250,.9)');
  g2.addColorStop(.6,'rgba(255,230,240,.4)');
  g2.addColorStop(1,'rgba(255,230,240,0)');
  ctx.fillStyle=g2;ctx.fillRect(h-16,h-16,32,32);
  ctx.globalCompositeOperation='source-over';
  uniforms.particleTexture.value=new THREE.CanvasTexture(c);
}

// ===== 心形（带亮度焦点）=====
function createParticleModel(m,n){
  var p=new Float32Array(n*3);
  switch(m){
    case'heart':genHeart(p,n);break;case'nebula':genNebula(p,n);break;
    case'firework':genFirework(p,n);break;case'saturn':genSaturn(p,n);break;
    case'flower':genFlower(p,n);break;
  }
  return p;
}

function genHeart(p,n){
  if(!particleSizes||particleSizes.length!==n)particleSizes=new Float32Array(n);
  if(!particleBrightness||particleBrightness.length!==n)particleBrightness=new Float32Array(n);
  for(var i=0;i<n;i++){
    var x,y,z,valid=false;
    while(!valid){
      var u=Math.random()*Math.PI*2;
      var sx=16*Math.pow(Math.sin(u),3);
      var sy=13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u);
      var thickness=.3+Math.random()*.8;
      var normLen=Math.sqrt(sx*sx+sy*sy)||1;
      var nx=sx/normLen,ny=sy/normLen;
      var edgeFactor=Math.abs(sx)/16;
      var thick=thickness*(1-edgeFactor*.6);
      x=sx+nx*thick*(Math.random()-.5)*2;
      y=sy+ny*thick*(Math.random()-.5)*2;
      var widthAtY=Math.max(0,1-Math.pow(y/15,2));
      z=(Math.random()-.5)*widthAtY*3;
      var tipFactor=1+Math.max(0,-y/10)*.3;
      var arcFactor=1+Math.max(0,(y-5)/10)*.2;
      if(Math.random()<(tipFactor*arcFactor)*.7||i<n*.1)valid=true;
    }
    p[i*3]=x*.22;p[i*3+1]=y*.22;p[i*3+2]=z*.22;
    var distFromCenter=Math.sqrt(x*x+y*y+z*z)/16;
    particleSizes[i]=distFromCenter>.6?1.2+Math.random()*.8:.3+Math.random()*.5;
    // 亮度焦点：圆弧顶端最亮，底部尖端次之，中心暗
    var yNorm=y*.22; // 归一化到实际坐标
    if(yNorm>1.5)particleBrightness[i]=1.5; // 圆弧顶端
    else if(yNorm<-1.5)particleBrightness[i]=1.3; // 底部尖端
    else particleBrightness[i]=0.8; // 中心
  }
}
function genNebula(p,n){
  if(!particleBrightness||particleBrightness.length!==n)particleBrightness=new Float32Array(n);
  for(var i=0;i<n;i++){var t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=3+Math.random()*5+noise3D(Math.sin(ph)*Math.cos(t)*2,Math.sin(ph)*Math.sin(t)*2,Math.cos(ph)*2)*2.5;p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.sin(ph)*Math.sin(t);p[i*3+2]=r*Math.cos(ph);particleBrightness[i]=.8+Math.random()*.4;}
}
function genFirework(p,n){
  if(!particleBrightness||particleBrightness.length!==n)particleBrightness=new Float32Array(n);
  for(var i=0;i<n;i++){var a=i%6,t=(i/n)*3,an=(a/6)*Math.PI*2+t*Math.PI*2,r=t*3.5+Math.random()*.8;p[i*3]=r*Math.cos(an);p[i*3+1]=(Math.random()-.5)*1.5+t*.5;p[i*3+2]=r*Math.sin(an);particleBrightness[i]=.8+Math.random()*.4;}
}
function genSaturn(p,n){
  if(!particleBrightness||particleBrightness.length!==n)particleBrightness=new Float32Array(n);
  var cc=Math.floor(n*.35);for(var i=0;i<cc;i++){var t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=Math.pow(Math.random(),.5)*2.5;p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.sin(ph)*Math.sin(t)*.7;p[i*3+2]=r*Math.cos(ph);particleBrightness[i]=.8+Math.random()*.4;}for(var i=cc;i<n;i++){var MR=4+Math.random()*3,mR=(Math.random()-.5)*.6,t=Math.random()*Math.PI*2,ph=Math.random()*Math.PI*2,j=i*3;p[j]=(MR+mR*Math.cos(ph))*Math.cos(t);p[j+1]=mR*Math.sin(ph)*.3;p[j+2]=(MR+mR*Math.cos(ph))*Math.sin(t);particleBrightness[i]=.8+Math.random()*.4;}
}
function genFlower(p,n){
  if(!particleBrightness||particleBrightness.length!==n)particleBrightness=new Float32Array(n);
  for(var i=0;i<n;i++){var t=(i/n)*Math.PI*2,r=Math.abs(Math.cos(5*t/2))*5+.5;p[i*3]=r*Math.cos(t)+(Math.random()-.5)*.3;p[i*3+1]=(Math.random()-.5)*1.2;p[i*3+2]=r*Math.sin(t)+(Math.random()-.5)*.3;particleBrightness[i]=.8+Math.random()*.4;}
}

// ===== 流星 =====
function createMeteors(){
  var count=8,maxTrail=15,totalVerts=count*maxTrail;
  var geo=new THREE.BufferGeometry();
  var pos=new Float32Array(totalVerts*3),col=new Float32Array(totalVerts*3);
  for(var i=0;i<totalVerts;i++){pos[i*3]=0;pos[i*3+1]=-1000;pos[i*3+2]=0;}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setDrawRange(0,0);
  meteorSystem=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false,color:0x000000}));
  meteorSystem.userData={count:count,maxTrail:maxTrail,life:new Float32Array(count),head:new Float32Array(count*3),vel:new Float32Array(count*3),trailIdx:new Float32Array(count)};
  scene.add(meteorSystem);
}
function updateMeteors(dt){
  if(!meteorSystem||perfDegraded)return;
  var d=meteorSystem.userData,pos=meteorSystem.geometry.attributes.position.array,col=meteorSystem.geometry.attributes.color.array,drawCount=0;
  for(var m=0;m<d.count;m++){
    d.life[m]-=dt;
    if(d.life[m]<=0){if(Math.random()<dt*.1){d.head[m*3]=(Math.random()-.5)*50;d.head[m*3+1]=20+Math.random()*10;d.head[m*3+2]=(Math.random()-.5)*30-20;d.vel[m*3]=(Math.random()-.5)*15-5;d.vel[m*3+1]=-25-Math.random()*15;d.vel[m*3+2]=(Math.random()-.5)*8;d.life[m]=.8+Math.random()*.6;d.trailIdx[m]=0;for(var t=0;t<d.maxTrail;t++){var bi=(m*d.maxTrail+t)*3;pos[bi+1]=-1000;}}}continue;}
    d.vel[m*3+1]-=dt*8;d.head[m*3]+=d.vel[m*3]*dt;d.head[m*3+1]+=d.vel[m*3+1]*dt;d.head[m*3+2]+=d.vel[m*3+2]*dt;
    var ti=Math.floor(d.trailIdx[m])%d.maxTrail,base=(m*d.maxTrail+ti)*3;
    pos[base]=d.head[m*3];pos[base+1]=d.head[m*3+1];pos[base+2]=d.head[m*3+2];
    var lf=d.life[m]/1.4;col[base]=1;col[base+1]=.84*lf+.5*(1-lf);col[base+2]=.1*lf+.6*(1-lf);
    d.trailIdx[m]=(ti+1);var prevIdx=ti;
    for(var t=0;t<d.maxTrail-1;t++){var curr=prevIdx,prev=(curr-1+d.maxTrail)%d.maxTrail,cb=(m*d.maxTrail+curr)*3,pb=(m*d.maxTrail+prev)*3;if(pos[pb+1]<-30)break;var fade=1-t/d.maxTrail,o=drawCount*3;pos[o]=pos[cb];pos[o+1]=pos[cb+1];pos[o+2]=pos[cb+2];pos[o+3]=pos[pb];pos[o+4]=pos[pb+1];pos[o+5]=pos[pb+2];col[o]=col[cb];col[o+1]=col[cb+1];col[o+2]=col[cb+2];col[o+3]=col[pb]*fade;col[o+4]=col[pb+1]*fade;col[o+5]=col[pb+2]*fade;drawCount++;prevIdx=prev;}
  }
  meteorSystem.geometry.setDrawRange(0,drawCount*2);meteorSystem.geometry.attributes.position.needsUpdate=true;meteorSystem.geometry.attributes.color.needsUpdate=true;
}

// ===== 星云（更亮，不依赖 Bloom）=====
function createNebulaPlanes(){
  var colors=[[.18,.07,.25],[.12,.05,.18],[.22,.10,.28]];
  for(var l=0;l<CONFIG.NEBULA_LAYERS;l++){
    var geo=new THREE.PlaneGeometry(200,200,1,1);
    var mat=new THREE.ShaderMaterial({
      fog:false,
      uniforms:{time:uniforms.time,layerIdx:{value:l},baseColor:{value:new THREE.Color(colors[l][0],colors[l][1],colors[l][2])}},
      vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader:[
        'uniform float time;uniform float layerIdx;uniform vec3 baseColor;varying vec2 vUv;',
        'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
        'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}',
        'float fbm(vec2 p){float v=0.0,a=.5;for(int i=0;i<2;i++){v+=a*noise(p);p*=2.0;a*=.5;}return v;}',
        'void main(){',
        '  vec2 uv=vUv*3.0+layerIdx*1.7;float t=time*.015*(.8+layerIdx*.3);',
        '  float n=fbm(uv+vec2(t,t*.7));',
        '  float alpha=smoothstep(.15,.65,n)*.35;',
        '  vec3 col=baseColor;',
        '  col+=baseColor*alpha*.5;', // 自身发光
        '  gl_FragColor=vec4(col,alpha);',
        '}'
      ].join('\n'),
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
    });
    var plane=new THREE.Mesh(geo,mat);
    plane.position.z=-30-l*15;plane.rotation.x=l*.15;
    scene.add(plane);nebulaSystems.push(plane);
  }
}

// ===== 粒子 shader 工厂 =====
function makeShader(PS,PO,brightnessMul,glowBoost){
  return new THREE.ShaderMaterial({
    uniforms:uniforms,
    vertexShader:[
      'attribute float aSize;attribute float aSpeed;attribute float aBrightness;',
      'uniform float openness;uniform float time;',
      'varying float vDist;varying float vAlpha;varying float vPhase;varying float vBright;',
      'void main(){',
      '  vec3 pos=position;',
      '  float bt=time*'+CONFIG.BREATHING_SPEED.toFixed(1)+'*aSpeed+aSize*10.0;',
      '  pos+=vec3(sin(bt)*'+CONFIG.BREATHING_AMPLITUDE.toFixed(3)+',cos(bt*.7)*'+CONFIG.BREATHING_AMPLITUDE.toFixed(3)+',sin(bt*1.3)*'+CONFIG.BREATHING_AMPLITUDE.toFixed(3)+');',
      '  float sc=mix('+CONFIG.SCALE_MIN.toFixed(1)+','+CONFIG.SCALE_MAX.toFixed(1)+',openness);pos*=sc;',
      '  vec4 mv=modelViewMatrix*vec4(pos,1.0);',
      '  vDist=length(position)/6.0;vAlpha=smoothstep(80.0,8.0,-mv.z);vPhase=aSpeed;vBright=aBrightness;',
      '  float pulse=.7+.6*(.5+.5*sin(time*aSpeed*1.5));',
      '  gl_PointSize=max(aSize*'+PS+'*(400.0/-mv.z)*pulse,1.0);', // 400 基础更大
      '  gl_Position=projectionMatrix*mv;',
      '}'
    ].join('\n'),
    fragmentShader:[
      'uniform vec3 baseColor;uniform float time;uniform float openness;uniform sampler2D particleTexture;',
      'varying float vDist;varying float vAlpha;varying float vPhase;varying float vBright;',
      'void main(){',
      '  vec4 tc=texture2D(particleTexture,gl_PointCoord);if(tc.a<.01)discard;',
      '  float t=time*.04+vPhase*.3;',
      '  vec3 warm=vec3(1.,.42,.62);vec3 rose=vec3(1.,.72,.70);vec3 lav=vec3(.88,.67,1.);',
      '  float drift=.5+.5*sin(t);',
      '  vec3 c=mix(warm,rose,drift*.6);',
      '  c=mix(c,lav,smoothstep(.6,1.,vDist));',
      '  c=mix(c,vec3(1.,.96,.93),vDist<.3?.3*(1.-vDist/.3):0.);',
      '  float brightness=(1.3-vDist*.4)*vBright'+(brightnessMul?'*'+brightnessMul:'')+';',
      '  c*=brightness;',
      '  c=pow(c,vec3(0.85));', // 伽马提亮
      '  c*=(1.5+openness*0.5);', // 手掌张开更亮
      +(glowBoost||'')+
      '  c=clamp(c,0.0,1.8);',
      '  float breathe=.85+.15*sin(time*vPhase*2.);',
      '  gl_FragColor=vec4(c,tc.a*'+PO+'*vAlpha*breathe);',
      '}'
    ].join('\n'),
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });
}

// ===== 粒子系统（三层）=====
function createParticleSystem(count){
  [particleSystem,haloSystem,coreSystem].forEach(function(s){if(s){scene.remove(s);s.geometry.dispose();s.material.dispose();}});

  var geo=new THREE.BufferGeometry();
  particlePositions=new Float32Array(count*3);particleTargets=new Float32Array(count*3);particleStarts=new Float32Array(count*3);
  if(!particleSizes||particleSizes.length!==count){particleSizes=new Float32Array(count);for(var i=0;i<count;i++)particleSizes[i]=.5+Math.random();}
  if(!particleBrightness||particleBrightness.length!==count){particleBrightness=new Float32Array(count);for(var i=0;i<count;i++)particleBrightness[i]=.8+Math.random()*.4;}
  particleSpeeds=new Float32Array(count);for(var i=0;i<count;i++)particleSpeeds[i]=.5+Math.random()*1.5;
  var mp=createParticleModel(currentModel,count);
  particlePositions.set(mp);particleTargets.set(mp);particleStarts.set(mp);
  geo.setAttribute('position',new THREE.BufferAttribute(particlePositions,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(particleSizes,1));
  geo.setAttribute('aSpeed',new THREE.BufferAttribute(particleSpeeds,1));
  geo.setAttribute('aBrightness',new THREE.BufferAttribute(particleBrightness,1));

  // 中层主粒子
  particleSystem=new THREE.Points(geo,makeShader(CONFIG.PARTICLE_BASE_SIZE.toFixed(1),CONFIG.PARTICLE_OPACITY.toFixed(2),'1.0'));
  scene.add(particleSystem);

  // 外层光晕（30%，大尺寸低饱和玫瑰金，固定色不流动）
  var hc=Math.floor(count*.3);
  var hGeo=new THREE.BufferGeometry();
  var hPos=new Float32Array(hc*3),hSizes=new Float32Array(hc),hSpeeds=new Float32Array(hc),hBri=new Float32Array(hc);
  for(var i=0;i<hc;i++){var idx=i%count;hPos[i*3]=mp[idx*3];hPos[i*3+1]=mp[idx*3+1];hPos[i*3+2]=mp[idx*3+2];hSizes[i]=(particleSizes[idx]||1)*4.5;hSpeeds[i]=.15+Math.random()*.2;hBri[i]=1;}
  hGeo.setAttribute('position',new THREE.BufferAttribute(hPos,3));
  hGeo.setAttribute('aSize',new THREE.BufferAttribute(hSizes,1));
  hGeo.setAttribute('aSpeed',new THREE.BufferAttribute(hSpeeds,1));
  hGeo.setAttribute('aBrightness',new THREE.BufferAttribute(hBri,1));
  // 外层专用 shader：固定玫瑰金，不流动
  var haloMat=new THREE.ShaderMaterial({
    uniforms:uniforms,
    vertexShader:[
      'attribute float aSize;attribute float aSpeed;attribute float aBrightness;uniform float openness;uniform float time;',
      'varying float vAlpha;',
      'void main(){',
      '  vec3 pos=position;',
      '  float bt=time*0.15*aSpeed+aSize*10.0;pos+=vec3(sin(bt)*0.04,cos(bt*0.7)*0.04,sin(bt*1.3)*0.04);',
      '  float sc=mix(0.5,3.0,openness);pos*=sc;',
      '  vec4 mv=modelViewMatrix*vec4(pos,1.0);',
      '  vAlpha=smoothstep(80.0,8.0,-mv.z);',
      '  gl_PointSize=max(aSize*4.5*(400.0/-mv.z),1.0);',
      '  gl_Position=projectionMatrix*mv;',
      '}'
    ].join('\n'),
    fragmentShader:[
      'uniform sampler2D particleTexture;varying float vAlpha;',
      'void main(){',
      '  vec4 tc=texture2D(particleTexture,gl_PointCoord);if(tc.a<.01)discard;',
      '  vec3 c=vec3(1.0,0.75,0.8);', // 固定玫瑰金
      '  gl_FragColor=vec4(c,tc.a*0.08*vAlpha);',
      '}'
    ].join('\n'),
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });
  haloSystem=new THREE.Points(hGeo,haloMat);scene.add(haloSystem);

  // 内层核心（10%，极亮钻石点，负责触发 Bloom）
  var cc=Math.floor(count*.1);
  var cGeo=new THREE.BufferGeometry();
  var cPos=new Float32Array(cc*3),cSizes=new Float32Array(cc),cSpeeds=new Float32Array(cc),cBri=new Float32Array(cc);
  for(var i=0;i<cc;i++){var idx=Math.floor(Math.random()*count);cPos[i*3]=mp[idx*3];cPos[i*3+1]=mp[idx*3+1];cPos[i*3+2]=mp[idx*3+2];cSizes[i]=.3+Math.random()*.3;cSpeeds[i]=2.5+Math.random()*2;cBri[i]=2.0;}
  cGeo.setAttribute('position',new THREE.BufferAttribute(cPos,3));
  cGeo.setAttribute('aSize',new THREE.BufferAttribute(cSizes,1));
  cGeo.setAttribute('aSpeed',new THREE.BufferAttribute(cSpeeds,1));
  cGeo.setAttribute('aBrightness',new THREE.BufferAttribute(cBri,1));
  coreSystem=new THREE.Points(cGeo,makeShader('1.0','0.7','2.0'));scene.add(coreSystem);
}

// ===== 背景星星（高亮，不依赖 Bloom）=====
function createBackgroundStars(){
  if(bgStarSystem){scene.remove(bgStarSystem);bgStarSystem.geometry.dispose();bgStarSystem.material.dispose();}
  var n=CONFIG.BG_STAR_COUNT,geo=new THREE.BufferGeometry();
  var pos=new Float32Array(n*3),col=new Float32Array(n*3),phases=new Float32Array(n),sizes=new Float32Array(n);
  var warmHues=[.08,.05,.95,.1,.0];
  for(var i=0;i<n;i++){
    pos[i*3]=(Math.random()-.5)*200;pos[i*3+1]=(Math.random()-.5)*200;pos[i*3+2]=CONFIG.BG_STAR_Z_MIN+Math.random()*(CONFIG.BG_STAR_Z_MAX-CONFIG.BG_STAR_Z_MIN);
    var h=warmHues[Math.floor(Math.random()*warmHues.length)]+Math.random()*.05;
    var c=new THREE.Color().setHSL(h,.2+Math.random()*.3,.7+Math.random()*.25); // 基础亮度 .7
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    var rnd=Math.random();
    if(rnd<.8){sizes[i]=.8;phases[i]=99;}
    else if(rnd<.95){sizes[i]=1.8;phases[i]=Math.random()*Math.PI*2;}
    else{sizes[i]=3.0;phases[i]=Math.random()*Math.PI*2;}
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aPhase',new THREE.BufferAttribute(phases,1));
  geo.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
  var mat=new THREE.ShaderMaterial({
    uniforms:{time:uniforms.time,brightnessComp:{value:1.0}},
    vertexShader:['attribute float aPhase;attribute float aSize;attribute vec3 color;uniform float time;',
      'varying vec3 vCol;varying float vBr;varying float vSz;',
      'void main(){vCol=color;vSz=aSize;',
      '  float speed=aPhase>50.?.0:aPhase>5.?1.5:0.5;',
      '  vBr=aPhase>50.?.7:.5+.5*sin(time*speed+aPhase);', // 基础亮度 .7
      '  vec4 mv=modelViewMatrix*vec4(position,1.0);',
      '  gl_PointSize=max(aSize*(250.0/-mv.z),0.3);',
      '  gl_Position=projectionMatrix*mv;}'].join('\n'),
    fragmentShader:['varying vec3 vCol;varying float vBr;varying float vSz;uniform float brightnessComp;',
      'void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;',
      '  float a=(1.0-smoothstep(.1,.5,d))*.55*vBr*brightnessComp;', // .55 高透明度
      '  float extra=vSz>2.5&&vBr>0.8?1.2:1.0;', // 亮星额外加亮
      '  gl_FragColor=vec4(vCol*extra,a);}'].join('\n'),
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  });
  bgStarSystem=new THREE.Points(geo,mat);scene.add(bgStarSystem);
}

// ===== 模型切换 =====
function switchModel(name){
  if(name===currentModel&&!isTransitioning)return;
  currentModel=name;particleStarts.set(particlePositions);
  var nt=createParticleModel(name,particleCount);
  for(var i=0;i<particleCount;i++){var j=i*3;
    if(i<nt.length/3){particleTargets[j]=nt[j];particleTargets[j+1]=nt[j+1];particleTargets[j+2]=nt[j+2];}
    else{particleTargets[j]=0;particleTargets[j+1]=0;particleTargets[j+2]=0;}
  }
  isTransitioning=true;transitionStartTime=clock.getElapsedTime();
}
function updateParticleCount(c){if(c===particleCount)return;particleCount=c;createParticleSystem(particleCount);}

  gui=new lil.GUI({title:'✨ 粒子星空',width:260});
  gui.domElement.style.position='fixed';gui.domElement.style.right='16px';gui.domElement.style.top='16px';gui.domElement.style.zIndex='100';
  var p={model:currentModel,baseColor:CONFIG.BASE_COLOR,particleCount:particleCount,bloomStrength:CONFIG.BLOOM_STRENGTH,handSensitivity:CONFIG.OPENNESS_SENSITIVITY};
  gui.add(p,'model',{'❤️ 爱心':'heart','🌌 星云':'nebula','🎆 烟花':'firework','🪐 土星':'saturn','🌸 花朵':'flower'}).name('✨ 模型').onChange(function(v){switchModel(v);});
  gui.addColor(p,'baseColor').name('🎨 颜色').onChange(function(v){uniforms.baseColor.value.set(v);});
  gui.add(p,'particleCount',CONFIG.PARTICLE_COUNT_MIN,CONFIG.PARTICLE_COUNT_MAX,CONFIG.PARTICLE_COUNT_STEP).name('✨ 密度').onFinishChange(function(v){updateParticleCount(Math.round(v));});
  // 辉光联动：bloom 越低，背景越亮
  gui.add(p,'bloomStrength',0,1,.05).name('💫 辉光').onChange(function(v){
    bloomPass.strength=v;bloomPass.enabled=v>.05;

    if(bgStarSystem&&bgStarSystem.material.uniforms.brightnessComp)bgStarSystem.material.uniforms.brightnessComp.value=compensate;
  });
  gui.add(p,'handSensitivity',.5,2,.1).name('🖐️ 灵敏度').onChange(function(v){CONFIG.OPENNESS_SENSITIVITY=v;});
}

// ===== 鼠标/触摸 =====
function initMouseInteraction(){
  var cv=renderer.domElement;
  cv.addEventListener('mousedown',function(e){if(handState.detected)return;mouseState.isDown=true;mouseState.prevX=e.clientX;mouseState.prevY=e.clientY;});
  window.addEventListener('mousemove',function(e){if(!mouseState.isDown||handState.detected)return;targetRotation.y+=(e.clientX-mouseState.prevX)*CONFIG.MOUSE_ROTATION_SPEED;targetRotation.x+=(e.clientY-mouseState.prevY)*CONFIG.MOUSE_ROTATION_SPEED;mouseState.prevX=e.clientX;mouseState.prevY=e.clientY;});
  window.addEventListener('mouseup',function(){mouseState.isDown=false;});
  cv.addEventListener('wheel',function(e){if(handState.detected)return;e.preventDefault();mouseState.targetWheel=Math.max(0,Math.min(1,mouseState.targetWheel-e.deltaY*CONFIG.MOUSE_WHEEL_SPEED*.01));},{passive:false});
  var tpx=0,tpy=0,pinchD=0,touching=false;
  cv.addEventListener('touchstart',function(e){if(handState.detected)return;if(e.touches.length===1){touching=true;tpx=e.touches[0].clientX;tpy=e.touches[0].clientY;}else if(e.touches.length===2){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;pinchD=Math.sqrt(dx*dx+dy*dy);}},{passive:true});
  cv.addEventListener('touchmove',function(e){if(handState.detected)return;e.preventDefault();if(e.touches.length===1&&touching){targetRotation.y+=(e.touches[0].clientX-tpx)*CONFIG.MOUSE_ROTATION_SPEED;targetRotation.x+=(e.touches[0].clientY-tpy)*CONFIG.MOUSE_ROTATION_SPEED;tpx=e.touches[0].clientX;tpy=e.touches[0].clientY;}else if(e.touches.length===2){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,nd=Math.sqrt(dx*dx+dy*dy);mouseState.targetWheel=Math.max(0,Math.min(1,mouseState.targetWheel+(nd-pinchD)*.005));pinchD=nd;}},{passive:false});
  cv.addEventListener('touchend',function(){touching=false;},{passive:true});
}

function initKeyboard(){
  window.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(k==='0')switchModel('heart');else if(k==='1')switchModel('nebula');else if(k==='2')switchModel('firework');
    else if(k==='3')switchModel('saturn');else if(k==='4')switchModel('flower');
    else if(k===' '){e.preventDefault();rotationPaused=!rotationPaused;}
    else if(k==='f')toggleFullscreen();else if(k==='s'&&!e.ctrlKey&&!e.metaKey)takeScreenshot();
  });
}

// ===== 手部追踪 =====
function initHandTracking(){
  var videoEl=document.getElementById('webcam-video'),overlayEl=document.getElementById('webcam-overlay'),statusEl=document.getElementById('hand-status');
  if(!FilesetResolver||!HandLandmarker){showWebcamError('手部模型不可用');setTimeout(function(){document.getElementById('webcam-container').style.display='none';},3000);return;}
  setLoadProgress('加载 MediaPipe...');
  FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm')
  .then(function(v){return HandLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:'hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:0.5,minHandPresenceConfidence:0.5,minTrackingConfidence:0.5})
    .catch(function(){return HandLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:'hand_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:0.5,minHandPresenceConfidence:0.5,minTrackingConfidence:0.5});});
  }).then(function(d){if(!d)throw new Error('null');handLandmarker=d;startCamera();})
  .catch(function(e){showWebcamError('手部模型加载失败');setTimeout(function(){document.getElementById('webcam-container').style.display='none';},5000);});

  function startCamera(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showWebcamError('不支持摄像头');return;}
    try{if(mpVideoStream){mpVideoStream.getTracks().forEach(function(t){t.stop();});mpVideoStream=null;}}catch(e){}
    navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}})
    .then(function(s){mpVideoStream=s;videoEl.srcObject=s;videoEl.onloadedmetadata=function(){videoEl.play();overlayEl.classList.add('hidden');var hc=document.getElementById('hand-canvas');hc.width=videoEl.videoWidth;hc.height=videoEl.videoHeight;startLoop();};})
    .catch(function(e){var m='无法访问摄像头';if(e.name==='NotAllowedError')m='权限被拒绝';showWebcamError(m);});
  }
  var firstOK=false;
  function startLoop(){
    mpLoadTimer=setTimeout(function(){if(!firstOK)statusEl.textContent='加载超时';},15000);
    function f(){if(!handLandmarker||!videoEl||videoEl.readyState<2){requestAnimationFrame(f);return;}
      try{var r=handLandmarker.detectForVideo(videoEl,performance.now());if(!firstOK&&r.landmarks&&r.landmarks.length>0){firstOK=true;if(mpLoadTimer)clearTimeout(mpLoadTimer);}onHandUpdate(r);}catch(e){}requestAnimationFrame(f);}
    requestAnimationFrame(f);
  }
}
function showWebcamError(m){var el=document.getElementById('webcam-overlay');el.classList.add('error');el.innerHTML='<div><div class="icon">⚠️</div><div>'+m+'</div></div>';}

function onHandUpdate(result){
  var hc=document.getElementById('hand-canvas'),ctx=hc.getContext('2d'),w=hc.width,h=hc.height;
  ctx.clearRect(0,0,w,h);
  if(result.landmarks&&result.landmarks.length>0){
    var lm=result.landmarks[0];handState.detected=true;
    document.getElementById('hand-status').textContent='✨ 已检测';document.getElementById('control-mode').textContent='🖐️';
    drawHandSkeleton(ctx,lm,w,h);
    var pcx=(lm[0].x+lm[9].x)/2,pcy=(lm[0].y+lm[9].y)/2,pcz=(lm[0].z+lm[9].z)/2;
    var td=0,tips=[4,8,12,16,20];for(var j=0;j<5;j++){var dx=lm[tips[j]].x-pcx,dy=lm[tips[j]].y-pcy,dz=lm[tips[j]].z-pcz;td+=Math.sqrt(dx*dx+dy*dy+dz*dz);}
    handState.targetOpenness=Math.max(0,Math.min(1,(td/5-.04)/.30))*CONFIG.OPENNESS_SENSITIVITY;
    handState.targetDx=-(lm[0].x-.5)*2;handState.targetDy=(lm[0].y-.5)*2;
  }else{handState.detected=false;document.getElementById('hand-status').textContent='未检测';document.getElementById('control-mode').textContent='🖱️';handState.targetOpenness=0;handState.targetDx=0;handState.targetDy=0;}
}

function drawHandSkeleton(ctx,lm,w,h){
  var cn=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
  ctx.strokeStyle='rgba(255,230,200,.1)';ctx.lineWidth=1;
  for(var i=0;i<cn.length;i++){ctx.beginPath();ctx.moveTo(lm[cn[i][0]].x*w,lm[cn[i][0]].y*h);ctx.lineTo(lm[cn[i][1]].x*w,lm[cn[i][1]].y*h);ctx.stroke();}
  var tipIdx=[4,8,12,16,20];
  for(var t=0;t<tipIdx.length;t++){var x=lm[tipIdx[t]].x*w,y=lm[tipIdx[t]].y*h;ctx.save();ctx.shadowColor='rgba(255,215,0,.6)';ctx.shadowBlur=10;var g=ctx.createRadialGradient(x,y,0,x,y,6);g.addColorStop(0,'rgba(255,215,0,.8)');g.addColorStop(1,'rgba(255,215,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.restore();}
  var px=(lm[0].x+lm[9].x)/2*w,py=(lm[0].y+lm[9].y)/2*h;
  ctx.save();ctx.shadowColor='rgba(255,107,157,.5)';ctx.shadowBlur=10;var pg=ctx.createRadialGradient(px,py,0,px,py,14);pg.addColorStop(0,'rgba(255,107,157,.5)');pg.addColorStop(1,'rgba(255,107,157,0)');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.fill();ctx.restore();
}

function initWebcamDrag(){
  var ct=document.getElementById('webcam-container'),dragging=false,sx,sy,sl,sb;
  function start(x,y){dragging=true;sx=x;sy=y;var r=ct.getBoundingClientRect();sl=r.left;sb=window.innerHeight-r.bottom;}
  function move(x,y){if(!dragging)return;ct.style.left=(sl+(x-sx))+'px';ct.style.bottom=(sb-(y-sy))+'px';ct.style.right='auto';}
  function end(){dragging=false;}
  ct.addEventListener('mousedown',function(e){if(e.target.id==='webcam-label'||e.target===ct){start(e.clientX,e.clientY);e.preventDefault();}});
  document.addEventListener('mousemove',function(e){move(e.clientX,e.clientY);});document.addEventListener('mouseup',end);
  ct.addEventListener('touchstart',function(e){if(e.target.id==='webcam-label'||e.target===ct)start(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  document.addEventListener('touchmove',function(e){if(dragging)move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  document.addEventListener('touchend',end);
}

function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen().catch(function(){});}
function takeScreenshot(){var fl=document.getElementById('flash-overlay');fl.classList.add('active');setTimeout(function(){fl.classList.remove('active');},200);composer.render();renderer.domElement.toBlob(function(b){if(!b)return;var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='star-'+currentModel+'.png';a.click();URL.revokeObjectURL(u);},'image/png');}
function onResize(){var w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);composer.setSize(w,h);if(bloomPass&&bloomPass.resolution)bloomPass.resolution.set(w,h);}

// ===== 主循环 =====
var frameCount=0,lastFpsTime=0;
function animate(){
  requestAnimationFrame(animate);
  var dt=clock.getDelta(),elapsed=clock.getElapsedTime();
  uniforms.time.value=elapsed;

  fpsBuffer.push(dt);if(fpsBuffer.length>CONFIG.PERF_CHECK_FRAMES)fpsBuffer.shift();
  if(!perfDegraded&&fpsBuffer.length>=CONFIG.PERF_CHECK_FRAMES){
    var avgDt=fpsBuffer.reduce(function(a,b){return a+b;},0)/fpsBuffer.length;
    if(1/avgDt<CONFIG.PERF_LOW_FPS){perfDegraded=true;if(meteorSystem)meteorSystem.visible=false;nebulaSystems.forEach(function(n){n.visible=false;});if(particleCount>4000)updateParticleCount(Math.floor(particleCount/2));}
  }
  if(perfDegraded&&currentDPR>2){currentDPR=2;renderer.setPixelRatio(currentDPR);}

  var ls=CONFIG.SMOOTHING_FACTOR*60;
  handState.openness=damp(handState.openness,handState.targetOpenness,ls,dt);
  handState.dx=damp(handState.dx,handState.targetDx,ls,dt);
  handState.dy=damp(handState.dy,handState.targetDy,ls,dt);
  mouseState.wheelDelta=damp(mouseState.wheelDelta,mouseState.targetWheel,8,dt);
  uniforms.openness.value=handState.detected?handState.openness:mouseState.wheelDelta;

  if(!rotationPaused&&handState.detected){targetRotation.y+=handState.dx*CONFIG.ROTATION_SENSITIVITY;targetRotation.x+=handState.dy*CONFIG.ROTATION_SENSITIVITY;}

  if(isTransitioning){
    var t=Math.min(1,(elapsed-transitionStartTime)/(CONFIG.TRANSITION_DURATION/1000));
    var e=crystalTransition(t);
    for(var i=0;i<particleCount;i++){var j=i*3;particlePositions[j]=lerp(particleStarts[j],particleTargets[j],e);particlePositions[j+1]=lerp(particleStarts[j+1],particleTargets[j+1],e);particlePositions[j+2]=lerp(particleStarts[j+2],particleTargets[j+2],e);}
    if(t>=1){isTransitioning=false;particlePositions.set(particleTargets);}
    particleSystem.geometry.attributes.position.needsUpdate=true;
    if(haloSystem){var hp=haloSystem.geometry.attributes.position.array;for(var i=0;i<hp.length/3;i++){var idx=(i%particleCount)*3;hp[i*3]=particlePositions[idx];hp[i*3+1]=particlePositions[idx+1];hp[i*3+2]=particlePositions[idx+2];}haloSystem.geometry.attributes.position.needsUpdate=true;}
  }

  if(particleSystem){
    if(!handState.detected&&!mouseState.isDown)targetRotation.y+=dt*CONFIG.AUTO_ROTATE_SPEED;
    particleSystem.rotation.x=damp(particleSystem.rotation.x,targetRotation.x,3,dt);
    particleSystem.rotation.y=damp(particleSystem.rotation.y,targetRotation.y,3,dt);
    if(haloSystem){haloSystem.rotation.x=particleSystem.rotation.x;haloSystem.rotation.y=particleSystem.rotation.y;}
    if(coreSystem){coreSystem.rotation.x=particleSystem.rotation.x;coreSystem.rotation.y=particleSystem.rotation.y;}
  }
  if(bgStarSystem)bgStarSystem.rotation.y+=dt*.01;
  updateMeteors(dt);
  composer.render();
  frameCount++;
  if(elapsed-lastFpsTime>=1){document.getElementById('fps-display').textContent=frameCount;document.getElementById('particle-count').textContent=particleCount;frameCount=0;lastFpsTime=elapsed;}
}

// ===== 初始化 =====
function init(){
  setLoadProgress('创建渲染器...');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0014); // 深紫背景
  scene.fog=new THREE.FogExp2(0x0a0014,.003);
  camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,500);camera.position.set(0,0,18);
  renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(currentDPR);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  setLoadProgress('后处理...');
  composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
  bloomPass=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),CONFIG.BLOOM_STRENGTH,CONFIG.BLOOM_RADIUS,CONFIG.BLOOM_THRESHOLD);composer.addPass(bloomPass);

  setLoadProgress('粒子纹理...');createParticleTexture();
  setLoadProgress('凝聚星尘...');createParticleSystem(particleCount);
  setLoadProgress('深空背景...');createBackgroundStars();createNebulaPlanes();createMeteors();

  if(typeof lil!=='undefined')createGUI();
  initMouseInteraction();initKeyboard();
  try{initHandTracking();}catch(e){document.getElementById('webcam-container').style.display='none';}
  initWebcamDrag();

  window.addEventListener('resize',onResize);
  document.getElementById('fullscreen-btn').addEventListener('click',toggleFullscreen);
  document.getElementById('screenshot-btn').addEventListener('click',takeScreenshot);
  document.getElementById('guide-start-btn').addEventListener('click',function(){document.getElementById('guide-overlay').classList.add('hidden');});
  document.getElementById('guide-dismiss-btn').addEventListener('click',function(){document.getElementById('guide-overlay').classList.add('hidden');try{localStorage.setItem('particle-guide-dismissed','1');}catch(e){}});
  try{if(!localStorage.getItem('particle-guide-dismissed'))document.getElementById('guide-overlay').classList.remove('hidden');}catch(e){}
  window.addEventListener('beforeunload',function(){if(mpVideoStream)mpVideoStream.getTracks().forEach(function(t){t.stop();});});

  setLoadProgress('✨ 就绪');
  setTimeout(function(){document.getElementById('loading-screen').classList.add('fade-out');},400);
}

init();animate();

}catch(err){
  console.error('初始化异常:',err);
  var ls=document.getElementById('loading-screen');
  if(ls)ls.innerHTML='<div style="text-align:center;color:#ffe4e1;padding:20px;"><div style="font-size:48px;">💫</div><h2 style="font-weight:300;">加载出了点问题</h2><p style="color:rgba(255,228,225,.4);font-size:13px;">'+(err.message||err)+'</p><button onclick="location.reload()" style="margin-top:16px;padding:10px 28px;border-radius:24px;background:linear-gradient(135deg,#ff6b9d,#e0aaff);border:none;color:#fff;cursor:pointer;">重试</button></div>';
}
</script>
